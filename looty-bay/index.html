<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looty Bay · Carte interactive ROB RUN</title>
<style>
:root{
  --bg:#0a1015; --panel:#0f171d; --panel2:#142028; --panel3:#1a2832; --line:#22323d; --line2:#2c414e;
  --text:#e7eff3; --muted:#8ea3ae; --dim:#5f7682; --accent:#3ee6b5; --gold:#f5c04a;
  --c-heist:#E0453F; --c-store:#F2B03D; --c-food:#F78C2B; --c-hotel:#5AB0FF; --c-home:#C6F432; --c-service:#6ED4BC;
  --r1:#9aa7b0; --r2:#5bd38c; --r3:#4fb3ff; --r4:#b98aff; --r5:#f5b83d; --r6:#ff5d8f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line);background:#0c141a;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:38px;width:auto;display:block}
.brand h1{margin:0;font-size:17px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:12px}
.hstats{display:flex;gap:18px;flex-wrap:wrap}
.xlink{margin-left:auto;color:var(--accent);text-decoration:none;font-weight:600;font-size:13px;border:1px solid var(--line2);border-radius:9px;padding:6px 11px;white-space:nowrap}
.xlink:hover{border-color:var(--accent)}
.hstats div{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.hstats b{font-size:16px}
.hstats span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
main{flex:1;display:flex;min-height:0}

/* ---------- Map ---------- */
#mapWrap{position:relative;flex:1;min-width:0;overflow:hidden;background:#61adb5}
#viewport{position:absolute;inset:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#viewport.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:1000px;height:819px;transform-origin:0 0;--ik:1}
#mapimg{position:absolute;left:0;top:0;width:1000px;height:819px;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.dlab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;font:italic 800 14px/1 system-ui,sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:#fff;-webkit-text-stroke:1.6px rgba(84,80,72,.85);paint-order:stroke fill;opacity:.95;z-index:1}
.mk{position:absolute;transform:translate(-50%,-50%) scale(var(--ik));width:38px;height:38px;border-radius:10px;
  border:1.5px solid var(--cc);background:#1c1f19;display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 4px 10px rgba(0,0,0,.45);transition:opacity .15s,transform .15s,border-color .15s;z-index:2}
.mk>img{width:26px;height:26px;display:block;pointer-events:none}
.mk:hover{transform:translate(-50%,-50%) scale(calc(var(--ik)*1.25));z-index:6}
.mk.sel{transform:translate(-50%,-50%) scale(calc(var(--ik)*1.25));border-color:var(--gold);border-width:2.5px;background:#2a2410;z-index:7;box-shadow:0 0 0 4px rgba(245,192,74,.25),0 4px 14px rgba(0,0,0,.6)}
.mk.dim{opacity:.2}
.mk.dim .lb{display:none!important}
.mk .bd{position:absolute;top:-9px;left:calc(100% - 10px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#1d1400;font:800 11px/18px system-ui,sans-serif;white-space:nowrap;box-shadow:0 1px 3px #0009}
.mk .lb{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;font:700 11px/1.1 system-ui,sans-serif;color:#fff;
  text-shadow:0 1px 2px #000,0 0 4px #000,0 0 4px #000;display:none;pointer-events:none}
#stage.zoomed .mk .lb{display:block}
.op{position:absolute;transform:translate(-50%,-50%) scale(var(--ik));width:16px;height:16px;border-radius:50%;background:var(--k);
  border:2px solid #10120e;box-shadow:0 2px 5px rgba(0,0,0,.5);z-index:1;cursor:help}
.op[hidden],.mk .bd[hidden]{display:none}
.cargo-point{position:absolute;transform:translate(-50%,-50%) scale(var(--ik));width:12px;height:12px;padding:0;border:2px solid #142028;border-radius:50%;background:#ffb34b;box-shadow:0 1px 4px #0008;z-index:8;cursor:pointer}
.cargo-point::before{content:"";position:absolute;inset:-6px}
.cargo-point.fixed{border-radius:2px;background:#69e6e1}
.cargo-point:hover,.cargo-point:focus-visible,.cargo-point.sel{outline:3px solid #fff;z-index:9}
.cargo-point[hidden]{display:none}
.cargo-key{display:inline-block;width:11px;height:11px;border:1.5px solid #142028;border-radius:50%;background:#ffb34b;flex:none}
.cargo-key.fixed{border-radius:2px;background:#69e6e1}
.cargo-summary{display:flex;gap:8px;margin:12px 0}
.cargo-summary>div{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px}
.cargo-summary b{display:block;font-size:22px;color:var(--gold)}
.cargo-summary span{color:var(--muted);font-size:13px}
.cargo-note{border-left:3px solid #ffb34b;background:var(--panel2);padding:10px 12px;border-radius:0 8px 8px 0;color:#cbd8de;font-size:14px}
.cargo-tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.cargo-point-list{max-height:210px;overflow:auto;display:grid;gap:5px;margin-top:8px}
.cargo-row{display:flex;align-items:center;gap:7px;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:13px}
.cargo-row[aria-pressed="true"]{border-color:var(--gold)}
.cargo-row small{margin-left:auto;color:var(--muted);white-space:nowrap}
.cargo-legend{border-top:1px solid var(--line);margin-top:8px;padding-top:1px}
.cargo-legend label{font-size:13px}
.cargo-catalog{display:grid;gap:6px}
.cargo-catalog .btn{text-align:left;font-size:14px}
.mapctl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:10}
.mapctl button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:#0f1a20e6;cursor:pointer;font-size:18px;display:grid;place-items:center}
.mapctl button:hover{border-color:var(--accent)}
.legend{position:absolute;left:12px;bottom:12px;z-index:10;background:#0d171de8;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;max-width:calc(100% - 24px);backdrop-filter:blur(4px)}
.legend .lg{display:flex;flex-wrap:wrap;gap:6px 12px}
.legend .lg span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.legend .lg i{width:11px;height:11px;border-radius:3px;border:2px solid var(--cc);background:#1c1f19;display:inline-block}
.legend .lg i.dot{border-radius:50%;background:var(--k);border:2px solid #10120e}
.legend label{display:flex;align-items:center;gap:7px;margin-top:8px;color:var(--muted);cursor:pointer}
.legend input{accent-color:var(--accent)}
.legend label .kd{margin:0 1px;vertical-align:-1px}
.hint{position:absolute;right:12px;bottom:12px;z-index:10;font-size:11px;color:var(--muted);background:#0d171dcc;padding:5px 9px;border-radius:8px;pointer-events:none}
.tip{position:absolute;z-index:20;pointer-events:none;background:#08100ff2;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:12px;max-width:260px;box-shadow:0 6px 18px #000a;display:none}
.tip b{display:block;font-size:13px}
.tip span{color:var(--muted)}

/* ---------- Sidebar ---------- */
aside{width:430px;max-width:44vw;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;background:#0c141a}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 6px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#side{flex:1;overflow:auto;padding:14px 14px 40px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.search::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--muted);font-size:17px}
.fg{margin-bottom:10px}
.fg h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:12px;color:var(--muted)}
.chip:hover{color:var(--text)}
.chip.on{color:var(--text);border-color:var(--cc,var(--accent));background:color-mix(in srgb,var(--cc,var(--accent)) 16%,var(--panel2))}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip i.kd{width:10px;height:10px;background:var(--k)}
.chip small{color:var(--dim);font-size:11px}
.chip.on small{color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px;color:var(--muted);font-size:12px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:12px}
.ghead{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px}
.prow,.irow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:7px 8px;cursor:pointer}
.prow:hover,.irow:hover{background:var(--panel2);border-color:var(--line)}
.pg{flex:none;border-radius:9px;border:1.5px solid var(--cc);display:grid;place-items:center;background:#1c1f19}
.prow .pg{width:34px;height:34px}
.pg>img{width:70%;height:70%;display:block}
.kd{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--k);border:1.5px solid #10120e;flex:none}
.thumb{width:46px;height:32px;flex:none;border-radius:6px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--rc) 45%,#1c1f19),#15180f);border:1px solid color-mix(in srgb,var(--rc) 50%,transparent)}
.thumb>img{max-width:100%;max-height:100%;display:block}
.pn,.in{flex:1;min-width:0;display:flex;flex-direction:column}
.pn>span,.in .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn small,.in small{color:var(--muted);font-size:11.5px}
.pn small em{color:var(--accent);font-style:normal}
.pc{color:var(--muted);font-size:12px;white-space:nowrap;text-align:right}
.pc b{color:var(--gold);font-size:14px}
.irow .rd{display:none}
.irow .ip{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600;white-space:nowrap;font-size:13px}
.irow .ic{color:var(--text);font-weight:700;white-space:nowrap;font-size:12px;min-width:38px;text-align:right;background:var(--panel3);border-radius:7px;padding:2px 7px}
.empty{color:var(--muted);padding:18px 4px}
.note{color:var(--dim);font-size:12px;margin:6px 2px}
.muted{color:var(--muted)}
/* detail */
.back{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:6px 11px;cursor:pointer;color:var(--muted);margin-bottom:12px}
.back:hover{color:var(--text)}
.dt{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.dt .pg{width:52px;height:52px;border-width:2px;box-shadow:0 0 18px color-mix(in srgb,var(--cc) 25%,transparent)}
.gimg{display:block;max-width:100%;border-radius:10px;border:1px solid var(--line2);margin-top:6px}
.strip{display:block;max-width:100%;border-radius:8px;margin-top:6px}
.bigthumb{width:100%;height:150px;border-radius:12px;margin:4px 0 8px}
.bigthumb>img{max-height:130px}
.dt h2{margin:0;font-size:19px;line-height:1.2}
.dt h2 .suf{color:var(--muted);font-weight:500;font-size:14px}
.dt .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.dt .meta .cat{color:var(--cc);font-weight:700}
.job{display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--c-heist) 12%,var(--panel2));border:1px solid color-mix(in srgb,var(--c-heist) 40%,transparent);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
.desc{margin:8px 0 10px;color:#cbd8de}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.sec{margin-top:16px}
.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 .n{background:var(--panel3);color:var(--text);border-radius:7px;padding:1px 7px;font-size:11px;letter-spacing:0}
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.spot{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12.5px}
.spot b{margin-left:auto;color:var(--gold);font-size:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--rc) 18%,transparent);color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 45%,transparent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:10px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.num{font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.info p,.info li{color:#cbd8de}
.info ul{padding-left:18px;margin:6px 0}
.info a{color:var(--accent)}
.sortb{display:flex;gap:5px}
kbd{font:11px ui-monospace,monospace;background:var(--panel3);border:1px solid var(--line2);border-radius:5px;padding:0 5px}

@media (max-width:900px){
  body{overflow:auto;height:auto}
  main{flex-direction:column}
  #mapWrap{flex:none;height:58vh}
  aside{width:100%;max-width:none;border-left:0;border-top:1px solid var(--line)}
  #side{overflow:visible}
  .hstats{display:none}
  .hint{display:none}
  .legend{padding:7px 10px;font-size:11px}
  .mk{width:26px;height:26px;border-radius:7px}
  .mk>img{width:18px;height:18px}
  .op{width:12px;height:12px}
  .legend .lg{display:none}
  .legend label{margin-top:0}
}
</style>
</head>

  if (!om[key]) { om[key] = {x,y,kinds:[]}; OUT.push(om[key]); }
  if (!om[key].kinds.includes(k)) om[key].kinds.push(k);
}
const KT = {};
for (const k of Object.keys(KIND)) KT[k] = {in:0,out:0,top:null};
for (const p of PL) for (const [k,n] of Object.entries(p.spots)) {
  KT[k].in += n;
  if (!KT[k].top || n > KT[k].top.spots[k]) KT[k].top = p;
}
for (const [k] of D.map.pins) KT[k].out++;
const TOTAL_IN = PL.reduce((s,p) => s+p.nSpots, 0);

/* ---------- État ---------- */
const S = {view:"list", sel:null, item:null, q:"", qn:"", cats:new Set(), dists:new Set(), loot:null,
           iq:"", iqn:"", rars:new Set(), icats:new Set(), sort:"value", outdoor:false,
           cargoRandom:false,cargoFixed:false,cargoKind:"all",cargoPoint:null};
const HIST = [];

/* ====================================================================
   Carte : pan / zoom
   ==================================================================== */
const vp = $("#viewport"), stage = $("#stage"), tip = $("#tip");
let K = 1, TX = 0, TY = 0, K0 = 1, anim = null;
function apply(){
  stage.style.transform = `translate(${TX}px,${TY}px) scale(${K})`;
  stage.style.setProperty("--ik", 1/K);
  stage.classList.toggle("zoomed", K >= K0*2.3);
}
function clampPan(){
  const r = vp.getBoundingClientRect(), w = 1000*K, h = 819*K, m = 80;
  TX = Math.min(r.width - m, Math.max(m - w, TX));
  TY = Math.min(r.height - m, Math.max(m - h, TY));
}
function fitView(animate){
  const r = vp.getBoundingClientRect();
  K0 = Math.min(r.width/1000, r.height/819) * 0.96;
  const t = {k:K0, x:(r.width-1000*K0)/2, y:(r.height-819*K0)/2};
  animate ? animTo(t) : (K=t.k, TX=t.x, TY=t.y, apply());
}
function zoomAt(f, cx, cy){
  const nk = Math.min(K0*8, Math.max(K0*0.8, K*f));
  TX = cx - (cx-TX)*(nk/K); TY = cy - (cy-TY)*(nk/K); K = nk; clampPan(); apply();
}
function animTo(t){
  cancelAnimationFrame(anim);
  const s = {k:K,x:TX,y:TY}, t0 = performance.now(), dur = 380;
  const step = now => {
    const a = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-a,3);
    K = s.k+(t.k-s.k)*e; TX = s.x+(t.x-s.x)*e; TY = s.y+(t.y-s.y)*e; apply();
    if (a < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function focusPoint(x, y, minK){
  const r = vp.getBoundingClientRect();
  const k = Math.max(K, K0*(minK||2.6));
  animTo({k, x:r.width/2 - x*SX*k, y:r.height/2 - y*SY*k});
}
function fitPlaces(list){
  if (!list.length) return fitView(true);
  const r = vp.getBoundingClientRect();
  const xs = list.map(p=>p.x*SX), ys = list.map(p=>p.y*SY);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = 90;
  let k = Math.min((r.width-pad*2)/Math.max(x1-x0,1), (r.height-pad*2)/Math.max(y1-y0,1));
  k = Math.max(K0, Math.min(K0*3.2, k));
  animTo({k, x:r.width/2 - (x0+x1)/2*k, y:r.height/2 - (y0+y1)/2*k});
}
// Pointeurs (souris, tactile, pincement)
const ptrs = new Map(); let downAt = null, dragged = false, pinch = null, justDragged = false;
vp.addEventListener("pointerdown", e => {
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1) { downAt = {x:e.clientX, y:e.clientY, tx:TX, ty:TY}; dragged = false; }
  if (ptrs.size === 2) {
    const [a,b] = [...ptrs.values()];
    pinch = {d:Math.hypot(a.x-b.x, a.y-b.y), k:K}; dragged = true;
  }
});
vp.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2 && pinch) {
    const [a,b] = [...ptrs.values()], r = vp.getBoundingClientRect();
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    zoomAt((pinch.k*d/pinch.d)/K, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
    return;
  }
  if (!downAt) return;
  const dx = e.clientX-downAt.x, dy = e.clientY-downAt.y;
  if (!dragged && Math.hypot(dx,dy) > 5) { dragged = true; vp.classList.add("drag"); vp.setPointerCapture(e.pointerId); hideTip(); }
  if (dragged) { cancelAnimationFrame(anim); TX = downAt.tx+dx; TY = downAt.ty+dy; clampPan(); apply(); }
});
const endPtr = e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) {
    if (dragged) { justDragged = true; setTimeout(() => justDragged = false, 50); }
    downAt = null; vp.classList.remove("drag");
  }
};
vp.addEventListener("pointerup", endPtr);
vp.addEventListener("pointercancel", endPtr);
vp.addEventListener("wheel", e => {
  e.preventDefault(); cancelAnimationFrame(anim);
  const r = vp.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*0.0016), e.clientX-r.left, e.clientY-r.top);
}, {passive:false});
vp.addEventListener("dblclick", e => {
  if (e.target.closest(".mk,.cargo-point")) return;
  const r = vp.getBoundingClientRect(); zoomAt(1.8, e.clientX-r.left, e.clientY-r.top);
});
const zc = f => { const r = vp.getBoundingClientRect(); cancelAnimationFrame(anim); zoomAt(f, r.width/2, r.height/2); };
$("#zin").onclick = () => zc(1.5);
$("#zout").onclick = () => zc(1/1.5);
$("#zfit").onclick = () => fitView(true);
addEventListener("resize", () => fitView(false));

/* ---------- Marqueurs ---------- */
function buildMap(){
  $("#dlabels").innerHTML = D.map.labels.map(([n,x,y]) =>
    `<span class="dlab" style="left:${x*SX}px;top:${y*SY}px">${esc(n)}</span>`).join("");
  const box = $("#markers");
  for (const c of CARGO) {
    const b = document.createElement("button");
    b.className = "cargo-point" + (c.kind === "fixed" ? " fixed" : "");
    b.hidden = true;
    b.style.left = c.x*SX + "px"; b.style.top = c.y*SY + "px";
    const label = `${cargoName(c)} · ${PBY[c.slug].full} · point ${c.id}`;
    b.setAttribute("aria-label",label);
    b.dataset.cargoId = c.id;
    const content = `<b>${esc(cargoName(c))}</b><span>${esc(PBY[c.slug].full)} · altitude ${c.world[1].toFixed(1)} m</span><br><span>${c.kind === "random" ? "Type et présence non déterminés" : "Type défini dans le client · disponibilité non vérifiée"}</span>`;
    b.addEventListener("pointerenter",e => showTip(e,content));
    b.addEventListener("pointermove",moveTip);
    b.addEventListener("pointerleave",hideTip);
    b.addEventListener("focus",() => {const r=b.getBoundingClientRect();showTip({clientX:r.right,clientY:r.top},content);});
    b.addEventListener("blur",hideTip);
    b.addEventListener("click",() => {if (!justDragged) selectCargo(c.id);});
    box.appendChild(b); c.el = b;
  }
  for (const o of OUT) {
    const el = document.createElement("div");
    el.className = "op";
    el.style.left = o.x*SX + "px"; el.style.top = o.y*SY + "px";
    o.main = o.kinds.includes("atm") ? "atm" : o.kinds[0];
    el.style.setProperty("--k", A.kindColor[o.main]);
    el.addEventListener("pointerenter", e => showTip(e, `<b>${o.kinds.map(k=>KIND[k][0]).join(" · ")}</b><span>En extérieur</span>`));
    el.addEventListener("pointermove", moveTip);
    el.addEventListener("pointerleave", hideTip);
    box.appendChild(el); o.el = el;
  }
  for (const p of MAPPED) {
    const b = document.createElement("button");
    b.className = "mk";
    b.style.left = p.x*SX + "px"; b.style.top = p.y*SY + "px";
    b.style.setProperty("--cc", CAT[p.cat].c);
    b.setAttribute("aria-label", p.full);
    b.innerHTML = `${imgTag(placeIcon(p.slug))}<span class="bd" hidden></span><span class="lb">${esc(p.full)}</span>`;
    b.addEventListener("click", () => { if (justDragged) return; hideTip(); go("place", p.slug, {focus:false}); });
    b.addEventListener("pointerenter", e => showTip(e,
      `<b>${esc(p.full)}</b><span>${CAT[p.cat].fr} · ${esc(p.district)}</span>` +
      (p.job ? `<br><span>🎯 ${JOB[p.job]}</span>` : "") +
      `<br><span>${plural(p.nSpots,"point de butin","points de butin")} · ${plural(p.items.length,"objet","objets")}</span>`));
    b.addEventListener("pointermove", moveTip);
    b.addEventListener("pointerleave", hideTip);
    box.appendChild(b); p.el = b;
  }
}
function showTip(e, html){ if (dragged && downAt) return; tip.innerHTML = html; tip.style.display = "block"; moveTip(e); }
function moveTip(e){
  const r = $("#mapWrap").getBoundingClientRect();
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > r.width - 8) x = e.clientX - r.left - w - 14;
  if (y + h > r.height - 8) y = e.clientY - r.top - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(){ tip.style.display = "none"; }

function placeMatches(p){
  if (S.cats.size && !S.cats.has(p.cat)) return false;
  if (S.dists.size && !S.dists.has(p.district)) return false;
  if (S.loot && !p.spots[S.loot]) return false;
  if (S.qn && !p.sn.includes(S.qn) && !p.items.some(id => IT[id].sn.includes(S.qn))) return false;
  return true;
}
function updateMap(){
  const itemMode = S.view === "item" && S.item;
  const filterOn = S.view === "list" || S.view === "place";
  let rel = null;
  if (itemMode) { rel = {}; for (const {slug,k,e} of (BYITEM[S.item]||[])) (rel[slug] = rel[slug]||[]).push([k,e]); }
  for (const p of MAPPED) {
    let on, badge = "";
    if (itemMode) {
      on = !!rel[p.slug];
      if (on) badge = rel[p.slug].map(([k,e]) => k==="f" ? "×"+e[1] : k==="r" ? "~"+e[1] : k==="m" ? "?" : k==="u" ? "🔑" : "🔒").join(" ");
    } else {
      on = filterOn ? placeMatches(p) : true;
      if (on && filterOn && S.loot) badge = String(p.spots[S.loot]);
    }
    p.el.classList.toggle("dim", !on);
    p.el.classList.toggle("sel", S.view === "place" && S.sel === p.slug);
    const bd = p.el.querySelector(".bd"); bd.hidden = !badge; bd.textContent = badge;
  }
  for (const o of OUT) {
    const clean = !S.cats.size && !S.dists.size && !S.qn;
    const byLoot = filterOn && clean && S.loot && o.kinds.includes(S.loot);          // comme sur le site : visibles avec le filtre de butin
    const byBox = S.outdoor && (!filterOn || (clean && (!S.loot || o.kinds.includes(S.loot)))); // ou via la case de la légende
    o.el.hidden = itemMode || !(byLoot || byBox);
    o.el.style.setProperty("--k", A.kindColor[filterOn && S.loot && o.kinds.includes(S.loot) ? S.loot : o.main]);
  }
  for (const c of CARGO) {
    const selectedPlace = S.view === "place" && S.sel === c.slug;
    const enabled = c.kind === "random" ? S.cargoRandom : S.cargoFixed;
    const matchingKind = S.view !== "cargo" || S.cargoKind === "all" || S.cargoKind === c.kind;
    const matchingPlace = S.view === "place" ? selectedPlace : !filterOn || placeMatches(PBY[c.slug]);
    c.el.hidden = itemMode || !enabled || !matchingKind || !matchingPlace;
    c.el.classList.toggle("sel",S.cargoPoint === c.id);
  }
  $("#cargo-random").checked = S.cargoRandom;
  $("#cargo-fixed").checked = S.cargoFixed;
}

/* ====================================================================
   Panneau latéral
   ==================================================================== */
const side = $("#side");
function go(view, arg, opt={}){
  HIST.push({view:S.view, sel:S.sel, item:S.item, cargoPoint:S.cargoPoint, scroll:side.scrollTop});
  if (HIST.length > 60) HIST.shift();
  S.view = view;
  S.cargoPoint = null;
  if (view === "place") {S.sel = arg; S.cargoRandom = true; S.cargoFixed = true;}
  if (view === "item") S.item = arg;
  render(opt);
}
function back(){
  const h = HIST.pop();
  if (!h) { S.view = S.view === "item" ? "items" : "list"; render(); return; }
  S.view = h.view; S.sel = h.sel; S.item = h.item; S.cargoPoint = h.cargoPoint;
  render({scroll:h.scroll, focus:false});
}
function tab(view){
  HIST.length = 0; S.view = view; S.cargoPoint = null;
  if (view === "cargo") {S.cargoRandom = true; S.cargoFixed = true;}
  render();
}

function selectCargo(id){
  const c = CARGO_BY_ID[id]; if (!c) return;
  hideTip();
  HIST.push({view:S.view,sel:S.sel,item:S.item,cargoPoint:S.cargoPoint,scroll:side.scrollTop});
  S.view = "place"; S.sel = c.slug; S.cargoPoint = c.id;
  if (c.kind === "random") S.cargoRandom = true; else S.cargoFixed = true;
  render({focus:false}); focusPoint(c.x,c.y,5);
  $("#cargo-place").scrollIntoView({block:"nearest"});
}

function render(opt={}){
  const t = {list:"list",place:"list",items:"items",item:"items",cargo:"cargo",info:"info"}[S.view];
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  if (S.view === "list") listView();
  else if (S.view === "place") side.innerHTML = placeHTML(PBY[S.sel]);
  else if (S.view === "items") itemsView();
  else if (S.view === "item") side.innerHTML = itemHTML(IT[S.item]);
  else if (S.view === "cargo") side.innerHTML = cargoHTML();
  else side.innerHTML = infoHTML();
  side.scrollTop = opt.scroll || 0;
  updateMap();
  if (S.view === "place" && opt.focus !== false) { const p = PBY[S.sel]; if (p.placed) focusPoint(p.x, p.y); }
  if (S.view === "item" && opt.focus !== false) fitPlaces(IT[S.item].places.map(s => PBY[s]).filter(p => p.placed));
  const h = S.view === "place" ? (S.cargoPoint ? "#cargaison/"+S.cargoPoint : "#lieu/" + S.sel) : S.view === "item" ? "#objet/" + S.item : S.view === "items" ? "#objets" : S.view === "cargo" ? "#cargaisons" : S.view === "info" ? "#infos" : "";
  try { history.replaceState(null, "", h || location.pathname + location.search); } catch (err) {}
}

/* ---------- Rangées ---------- */
function prow(p){
  let right;
  if (S.loot) right = `${KIND[S.loot][1]} <b>${p.spots[S.loot]}</b>`;
  else right = !p.placed ? plural(p.items.length,"objet","objets") : p.nSpots || p.items.length ? `${p.nSpots} pts<br>${plural(p.items.length,"objet","objets")}` : "service";
  let sub = `${CAT[p.cat].fr} · ${esc(p.district)}` + (p.placed ? "" : " · hors carte");
  if (p.job) sub = `🎯 ${JOB[p.job]} · ` + sub;
  if (S.qn && !p.sn.includes(S.qn)) {
    const hit = p.items.map(id => IT[id]).filter(i => i.sn.includes(S.qn));
    if (hit.length) sub += ` · <em>${esc(hit[0].name)}${hit.length > 1 ? " +" + (hit.length-1) : ""}</em>`;
  }
  return `<button class="prow" data-slug="${p.slug}" style="--cc:${CAT[p.cat].c}"><span class="pg">${imgTag(placeIcon(p.slug))}</span>
    <span class="pn"><span>${esc(p.name)}${p.suffix ? ` <small style="display:inline">(${esc(p.suffix)})</small>` : ""}</span><small>${sub}</small></span>
    <span class="pc">${right}</span></button>`;
}
function itemRow(id, right="", sub=""){
  const i = IT[id];
  return `<button class="irow" data-item="${id}" style="--rc:var(--r${i.rar})"><span class="thumb">${imgTag(itemImg(id))}</span>
    <span class="in"><span class="nm">${esc(i.name)}</span><small>${RAR[i.rar]} · ${ICAT[i.cat]||esc(i.cat)}${sub ? " · " + sub : ""}</small></span>
    <span class="ip">${priceLabel(i)}</span>${right ? `<span class="ic">${right}</span>` : ""}</button>`;
}
function priceLabel(i){
  if (i.sell) return money(i.sell);
  if (i.type === "Cash") return "variable";
  if (i.type === "Cargo") return "cargaison";
  return "—";
}
function placeRow(slug, right="", sub=""){
  const p = PBY[slug];
  return `<button class="prow" data-slug="${slug}" style="--cc:${CAT[p.cat].c}"><span class="pg">${imgTag(placeIcon(slug))}</span>
    <span class="pn"><span>${esc(p.full)}</span><small>${esc(p.district)}${p.placed ? "" : " · hors carte"}${sub ? " · " + sub : ""}</small></span>
    ${right ? `<span class="pc"><b>${right}</b></span>` : ""}</button>`;
}
const ptsBadge = (c, pool) => {
  const t = pool.split(",").map(x => POOL[x]||x).join(", ");
  return `<span title="${c} point${c>1 ? "s" : ""} de butin « ${esc(t)} » dans ce lieu où le jeu peut faire apparaître cet objet (tirage aléatoire)">${c} pt${c>1 ? "s" : ""}</span>`;
};
const bySell = (a,b) => IT[b[0]].sell - IT[a[0]].sell || IT[a[0]].name.localeCompare(IT[b[0]].name);
function sec(title, rows, note=""){
  if (!rows.length) return "";
  return `<div class="sec"><h3>${title} <span class="n">${rows.length}</span></h3>${rows.join("")}${note ? `<p class="note">${note}</p>` : ""}</div>`;
}

/* ---------- Vue : liste des lieux ---------- */
function listView(){
  const catN = c => PL.filter(p => p.cat === c).length;
  const kinds = Object.keys(KIND).filter(k => KT[k].in + KT[k].out > 0);
  side.innerHTML = `
    <div class="search"><input id="q" type="search" autocomplete="off" placeholder="Rechercher un lieu, un quartier, un objet…" value="${esc(S.q)}"></div>
    <div class="fg"><h4>Catégorie</h4><div class="chips">${CAT_ORDER.map(c =>
      `<button class="chip" data-cat="${c}" style="--cc:${CAT[c].c}"><i></i>${CAT[c].fr} <small>${catN(c)}</small></button>`).join("")}</div></div>
    <div class="fg"><h4>Quartier</h4><div class="chips">${DIST_ORDER.map(d =>
      `<button class="chip" data-dist="${esc(d)}">${esc(d)} <small>${PL.filter(p => p.district === d).length}</small></button>`).join("")}</div></div>
    <div class="fg"><h4>Type de butin</h4><div class="chips">${kinds.map(k =>
      `<button class="chip" data-loot="${k}" title="${KT[k].in} en bâtiment${KT[k].out ? ", " + KT[k].out + " en extérieur" : ""}">${KIND[k][1]} ${KIND[k][0]} <small>${KT[k].in + KT[k].out}</small></button>`).join("")}</div></div>
    <div class="bar"><span id="count"></span><button class="link" data-act="reset">Réinitialiser les filtres</button></div>
    <div id="plist"></div>`;
  const q = $("#q");
  q.addEventListener("input", () => { S.q = q.value; S.qn = norm(q.value.trim()); refreshList(); });
  refreshList();
}
function refreshList(){
  $$("[data-cat]").forEach(b => b.classList.toggle("on", S.cats.has(b.dataset.cat)));
  $$("[data-dist]").forEach(b => b.classList.toggle("on", S.dists.has(b.dataset.dist)));
  $$("[data-loot]").forEach(b => b.classList.toggle("on", S.loot === b.dataset.loot));
  const vis = PL.filter(placeMatches);
  const c = $("#count"); if (c) c.textContent = `${vis.length} ${vis.length > 1 ? "lieux" : "lieu"} sur ${PL.length}`;
  let html = "";
  if (S.loot) {
    vis.sort((a,b) => b.spots[S.loot] - a.spots[S.loot]);
    const sum = vis.reduce((s,p) => s + p.spots[S.loot], 0);
    html += `<div class="ghead"><span style="display:inline-flex;align-items:center;gap:7px">${KIND[S.loot][1]} ${KIND[S.loot][0]}</span><span>${sum} en bâtiment</span></div>` + vis.map(prow).join("");
    const outN = OUT.filter(o => o.kinds.includes(S.loot)).length;
    if (outN && !S.cats.size && !S.dists.size && !S.qn) html += `<p class="note">+ ${plural(outN,"point","points")} en extérieur, affiché${outN > 1 ? "s" : ""} sur la carte en losange.</p>`;
  } else {
    for (const d of DIST_ORDER) {
      const g = vis.filter(p => p.district === d)
        .sort((a,b) => (b.placed - a.placed) || CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat) || a.name.localeCompare(b.name));
      if (g.length) html += `<div class="ghead">${esc(d)} <span>${g.length}</span></div>` + g.map(prow).join("");
    }
  }
  if (!vis.length) html = `<div class="empty">Aucun lieu ne correspond à ces filtres.</div>`;
  if (S.qn.length >= 2) {
    const its = Object.values(IT).filter(i => i.sn.includes(S.qn)).sort((a,b) => b.sell - a.sell);
    if (its.length) html += `<div class="ghead">Objets correspondants <span>${its.length}</span></div>` +
      its.slice(0,15).map(i => itemRow(i.id, plural(i.places.length,"lieu","lieux"))).join("") +
      (its.length > 15 ? `<p class="note">… et ${its.length-15} autres dans l'onglet Objets.</p>` : "");
  }
  $("#plist").innerHTML = html;
  updateMap();
}

/* ---------- Vue : détail d'un lieu ---------- */
function placeHTML(p){
  const R = REL(p.slug);
  const spots = Object.entries(p.spots);
  const f = [...R.f].sort(bySell).map(([id,c]) => itemRow(id, "×"+c));
  const r = [...R.r].sort(bySell).map(([id,c,pool]) => itemRow(id, ptsBadge(c, pool), esc(pool.split(",").map(x => POOL[x]||x).join(", "))));
  const m = [...R.m].sort(bySell).map(([id]) => itemRow(id));
  const n = R.n.map(([id,need]) => itemRow(id, "🔒", "nécessite : " + esc(need.join(", "))));
  const u = R.u.map(([id,wh]) => itemRow(id, "🔑", "ouvre : " + esc(trWh(wh))));
  return `
    <button class="back" data-act="back">← Retour</button>
    <div class="dt" style="--cc:${CAT[p.cat].c}"><div class="pg">${imgTag(placeIcon(p.slug))}</div>
      <div><h2>${esc(p.name)}${p.suffix ? ` <span class="suf">(${esc(p.suffix)})</span>` : ""}</h2>
      <div class="meta"><span class="cat">${CAT[p.cat].fr}</span> · ${esc(p.district)}</div></div></div>
    ${p.job ? `<div class="job">🎯 <span>Mission spéciale : <b>${JOB[p.job]}</b> <span class="muted">(${esc(p.job)})</span></span></div>` : ""}
    <p class="desc">${esc(p.fr)}</p>
    <div class="acts">${p.placed ? `<button class="btn" data-act="center">📍 Centrer sur la carte</button>` : ""}
      <button class="btn" data-act="district" data-d="${esc(p.district)}">Voir tout ${esc(p.district)}</button></div>
    <div class="sec"><h3>Points de butin <span class="n">${p.nSpots}</span></h3>
      ${spots.length ? `<div class="spots">${spots.map(([k,c]) => `<div class="spot"><span>${KIND[k][1]}</span>${KIND[k][0]}<b>${c}</b></div>`).join("")}</div>
      <p class="note">Comptés d'après les données de la carte (relevé du 15/11/2026). Ce que contient chaque point est aléatoire et varie selon le serveur.</p>`
      : p.placed ? `<p class="muted">Aucun point de butin : c'est un lieu de service.</p>` : `<p class="muted">Pas de relevé de points de butin pour ce lieu (il n'est pas placé sur la carte).</p>`}
    </div>
    ${cargoPlaceHTML(p)}
    ${sec("Trouvé ici", f, "Objets à emplacement fixe dans ce lieu (×&nbsp;quantité).")}
    ${sec("Butin aléatoire possible", r, "Le jeu tire au sort ce qui se trouve sur chaque point. Correspondance établie sur le type de point (nombre de points de ce type ici), non confirmée pour cet objet précis.")}
    ${sec("Peut aussi apparaître", m)}
    ${sec("Accès protégé", n, "Objet présent ici mais qu'on ne peut prendre qu'avec l'objet indiqué.")}
    ${sec("S'utilise ici", u, "Clés et outils qui ouvrent quelque chose dans ce lieu.")}
    ${!p.items.length && p.nSpots ? `<p class="note">Aucun objet précis n'est rattaché à ce lieu dans les données.</p>` : ""}`;
}

/* ---------- Vue : liste des objets ---------- */
function itemsView(){
  const cats = Object.keys(ICAT).filter(c => Object.values(IT).some(i => i.cat === c));
  side.innerHTML = `
    <div class="search"><input id="iq" type="search" autocomplete="off" placeholder="Rechercher un objet…" value="${esc(S.iq)}"></div>
    <div class="fg"><h4>Rareté</h4><div class="chips">${Object.keys(RAR).map(r =>
      `<button class="chip" data-rar="${r}" style="--cc:var(--r${r})"><i></i>${RAR[r]} <small>${Object.values(IT).filter(i => i.rar == r).length}</small></button>`).join("")}</div></div>
    <div class="fg"><h4>Catégorie</h4><div class="chips">${cats.map(c =>
      `<button class="chip" data-icat="${c}">${ICAT[c]} <small>${Object.values(IT).filter(i => i.cat === c).length}</small></button>`).join("")}</div></div>
    <div class="fg"><h4>Trier par</h4><div class="chips sortb">
      <button class="chip" data-sort="value">Valeur</button><button class="chip" data-sort="name">Nom</button><button class="chip" data-sort="places">Nombre de lieux</button></div></div>
    <div class="bar"><span id="icount"></span><button class="link" data-act="ireset">Réinitialiser</button></div>
    <div id="ilist"></div>`;
  const q = $("#iq");
  q.addEventListener("input", () => { S.iq = q.value; S.iqn = norm(q.value.trim()); refreshItems(); });
  refreshItems();
}
function refreshItems(){
  $$("[data-rar]").forEach(b => b.classList.toggle("on", S.rars.has(b.dataset.rar)));
  $$("[data-icat]").forEach(b => b.classList.toggle("on", S.icats.has(b.dataset.icat)));
  $$("[data-sort]").forEach(b => b.classList.toggle("on", S.sort === b.dataset.sort));
  let list = Object.values(IT).filter(i =>
    (!S.rars.size || S.rars.has(String(i.rar))) && (!S.icats.size || S.icats.has(i.cat)) && (!S.iqn || i.sn.includes(S.iqn)));
  const srt = {value:(a,b) => b.sell-a.sell || a.name.localeCompare(b.name),
               name:(a,b) => a.name.localeCompare(b.name) || b.rar-a.rar,
               places:(a,b) => b.places.length-a.places.length || b.sell-a.sell}[S.sort];
  list.sort(srt);
  $("#icount").textContent = `${list.length} ${list.length > 1 ? "objets" : "objet"} sur ${Object.keys(IT).length}`;
  $("#ilist").innerHTML = list.length ? list.map(i => {
    const sub = i.type === "Key" && i.uses.length ? "pour " + esc(i.uses.map(s => PBY[s].full).join(", ")) : esc(ITYPE[i.type] || i.type);
    return itemRow(i.id, plural(i.places.length,"lieu","lieux"), sub);
  }).join("") : `<div class="empty">Aucun objet ne correspond.</div>`;
}

/* ---------- Vue : détail d'un objet ---------- */
function itemHTML(i){
  const L = BYITEM[i.id] || [];
  const g = k => L.filter(x => x.k === k);
  const f = g("f").sort((a,b) => b.e[1]-a.e[1]).map(({slug,e}) => placeRow(slug, "×"+e[1]));
  const r = g("r").sort((a,b) => b.e[1]-a.e[1]).map(({slug,e}) => placeRow(slug, ptsBadge(e[1], e[2]), "points " + esc(e[2].split(",").map(x => POOL[x]||x).join(", "))));
  const m = g("m").map(({slug}) => placeRow(slug));
  const n = g("n").map(({slug,e}) => placeRow(slug, "🔒", "nécessite : " + esc(e[1].join(", "))));
  const u = g("u").map(({slug,e}) => placeRow(slug, "🔑", "ouvre : " + esc(trWh(e[1]))));
  let price;
  if (i.fence.length) {
    price = `<div class="sec"><h3>Prix de revente au Fence</h3><div class="tw"><table>
      <tr><th>Notoriété</th>${D.notoriety.map(x => `<th>Niv. ${x.level}</th>`).join("")}</tr>
      <tr><td>Bonus</td>${D.notoriety.map(x => `<td class="num">+${x.itemSale} %</td>`).join("")}</tr>
      <tr><td>Prix</td>${i.fence.map(v => `<td class="num">${money(v)}</td>`).join("")}</tr></table></div>
      <p class="note">Le bonus de vente d'objets augmente avec votre niveau de notoriété.</p></div>`;
  } else if (i.type === "Cargo") {
    price = `<p class="note">Cargaison : se revend au Smuggler's Van (prix selon votre bonus de vente de cargaison).</p>`;
  } else if (i.type === "Cash") {
    price = `<p class="note">Argent liquide : montant variable.</p>`;
  } else price = "";
  return `
    <button class="back" data-act="back">← Retour</button>
    <div class="thumb bigthumb" style="--rc:var(--r${i.rar})">${imgTag(itemImg(i.id))}</div>
    <h2 style="margin:0 0 6px;font-size:20px">${esc(i.name)}</h2>
    <span class="tag" style="--rc:var(--r${i.rar})">${RAR[i.rar]}</span>
    <dl class="kv">
      <dt>Catégorie</dt><dd>${ICAT[i.cat] || esc(i.cat)}</dd>
      <dt>Type</dt><dd>${esc(ITYPE[i.type] || i.type)}</dd>
      ${i.size ? `<dt>Taille</dt><dd>${esc(i.size)} cases</dd>` : ""}
      <dt>Prix de base</dt><dd style="color:var(--gold);font-weight:700">${i.sell ? money(i.sell) : "—"}</dd>
      <dt>Lieux</dt><dd>${plural(i.places.length,"lieu","lieux")}</dd>
    </dl>
    ${price}
    ${CARGO_ITEMS[i.id] ? `<div class="cargo-note">${esc(CARGO_ITEMS[i.id].use)}<br><b>Lieu d’apparition non déterminé.</b> Les emplacements aléatoires ne précisent pas quel objet y apparaît.</div><p><button class="btn" data-act="cargo">Voir les emplacements de cargaison</button></p>` : ""}
    ${sec("Trouvé à", f, "Emplacement fixe (×&nbsp;quantité).")}
    ${sec("Butin aléatoire possible à", r, "Nombre de points du type correspondant dans chaque lieu. Le contenu réel est tiré au sort.")}
    ${sec("Peut apparaître à", m)}
    ${sec("À prendre sous condition à", n)}
    ${sec("S'utilise à", u)}
    ${!L.length && !CARGO_ITEMS[i.id] ? `<p class="note">Cet objet n'est rattaché à aucun lieu de la carte.</p>` : ""}`;
}

/* ---------- Cargaisons : placements du client, distincts du butin en vrac ---------- */
function cargoPlaceHTML(p){
  const b = CARGO_BY_PLACE[p.slug]; if (!b) return "";
  const points = CARGO.filter(c => c.slug === p.slug);
  return `<section class="sec" id="cargo-place"><h3>Cargaisons <span class="n">${points.length} emplacements</span></h3>
    <div class="spots"><div class="spot"><i class="cargo-key"></i>Aléatoires<b>${b.random.length}</b></div>
    <div class="spot"><i class="cargo-key fixed"></i>Fixes<b>${b.fixed.length}</b></div></div>
    <p class="cargo-note">${b.random.length ? "Emplacements possibles : le type de cargaison et sa présence ne sont pas indiqués. Aucun plant ni bidon n’est attribué à ce lieu par ces données." : ""}
    ${b.fixed.length ? `<br>${b.fixed.length} ${p.slug === "police-station" ? "caisses de pièces d’armes" : "sacs bancaires remplis d’argent"} définis dans le client. Leur disponibilité actuelle n’est pas vérifiée.` : ""}</p>
    <div class="cargo-tools"><button class="btn" data-act="cargo-center">Voir tous les emplacements de ce lieu</button><button class="btn" data-act="cargo">Toutes les cargaisons</button></div>
    <details${S.cargoPoint ? " open" : ""}><summary>Points précis et étages</summary><p class="note">L’altitude Y distingue les étages ; plusieurs points peuvent se superposer sur la carte.</p>
    <div class="cargo-point-list">${points.map(c => `<button class="cargo-row" data-cargo-point="${c.id}" aria-pressed="${S.cargoPoint === c.id}"><i class="cargo-key${c.kind === "fixed" ? " fixed" : ""}"></i><span>${esc(cargoName(c))}</span><small>Y ${c.world[1].toFixed(1)} m · #${c.id}</small></button>`).join("")}</div></details></section>`;
}

function cargoHTML(){
  const list = C.buildings.filter(b => S.cargoKind === "all" || b[S.cargoKind].length)
    .sort((a,b) => (S.cargoKind === "fixed" ? b.fixed.length-a.fixed.length : b.random.length-a.random.length) || PBY[a.slug].full.localeCompare(PBY[b.slug].full));
  return `<div class="info"><h2 style="margin:0">Cargaisons</h2><p>Emplacements extraits des fichiers du jeu le 26/11/2026.</p>
    <div class="cargo-summary"><div><b>170</b><span>emplacements aléatoires</span></div><div><b>8</b><span>cargaisons fixes définies</span></div></div>
    <p class="cargo-note">Un point indique où chercher, pas un objet garanti. Pour les points aléatoires, le type, la probabilité et la présence de cargaison restent inconnus.</p>
    <div class="cargo-tools" aria-label="Type de cargaison">${[["all","Tout"],["random","Aléatoires"],["fixed","Fixes"]].map(([k,n]) => `<button class="chip${S.cargoKind === k ? " on" : ""}" data-cargo-kind="${k}" aria-pressed="${S.cargoKind === k}">${n}</button>`).join("")}</div>
    <div class="sec"><h3>Où chercher <span class="n">${list.length} lieux</span></h3>${list.map(b => placeRow(b.slug,`${b.random.length} aléat. · ${b.fixed.length} fixes`)).join("")}</div>
    <div class="sec"><h3>Plants et laboratoire</h3><p>Ces cargaisons existent dans le jeu. Leur répartition entre commerces n’est pas déterminée par les fichiers de placement.</p>
    <div class="cargo-catalog">${C.items.map(i => `<button class="btn" data-item="${i.id}">${esc(i.name)} <span class="tag" style="--rc:var(--r${i.rarity})">${RAR[i.rarity]}</span></button>`).join("")}</div></div>
    <p class="note">Les 14 conteneurs extérieurs déjà présents sur la carte constituent une autre couche. Les cargaisons fixes du commissariat et de la banque figurent déjà dans leurs listes d’objets : elles ne sont pas ajoutées une deuxième fois.</p>
    <p><a href="CARGO-SOURCES.md">Sources et méthode</a> · <a href="cargo-locations.csv" download>Coordonnées des 178 points (CSV)</a></p></div>`;
}

/* ---------- Vue : infos ---------- */
function infoHTML(){
  const kinds = Object.keys(KIND).filter(k => KT[k].in + KT[k].out > 0)
    .sort((a,b) => (KT[b].in+KT[b].out) - (KT[a].in+KT[a].out));
  const jobs = PL.filter(p => p.job);
  return `<div class="info">
    <div class="sec" style="margin-top:0"><h3>À propos</h3>
      <p>Carte personnelle de <b>Looty Bay</b>, la ville de ROB RUN (Kefir) : ${MAPPED.length} lieux répartis sur ${DIST_ORDER.length} quartiers,
       ${fmt(TOTAL_IN)} points de butin en bâtiment, ${D.map.pins.length} points en extérieur et ${Object.keys(IT).length} objets au catalogue.
      ${PL.length - MAPPED.length} cottages de Loraine Hills (No. 3, 4 et 5) sont cités dans les données des objets sans position sur la carte : ils apparaissent dans la liste avec la mention « hors carte ».</p>
      <ul>
        <li>Version des données du jeu : <b>${esc(D.build)}</b></li>
        <li>Points de butin relevés le <b>15/11/2026</b>, objets le <b>09/11/2026</b></li>
        <li>Source : EveryGameStat, carte interactive ROB RUN (everygamestat.com/rob-run/map), reprise le 25/11/2026</li>
        <li>Cargaisons : 170 emplacements aléatoires et 8 fixes extraits du client installé le 26/11/2026. <a href="CARGO-SOURCES.md">Sources et limites</a>.</li>
        <li>Fond de carte intégré au fichier. Icônes, fiches et images d'objets chargées depuis les serveurs d'EveryGameStat (connexion Internet nécessaire pour les voir).</li>
      </ul>
    </div>
    <div class="sec"><h3>Comment lire la carte</h3><ul>
      <li>Chaque carré est un lieu ; la couleur de sa bordure indique la catégorie.</li>
      <li>Les pastilles rondes sont des points en extérieur : ${kdot("atm")} distributeurs (avec coffre) et ${kdot("cargo")} conteneurs de cargaison. Elles sont masquées par défaut : elles apparaissent avec le filtre de butin correspondant, ou en cochant « Points extérieurs » dans la légende.</li>
      <li>Avec un filtre « Type de butin », le badge doré indique le nombre de points de ce type dans le lieu.</li>
      <li>Sur la fiche d'un objet, les badges indiquent : <b>×N</b> trouvé (quantité), <b>~N</b> aléatoire (N points du bon type), <b>?</b> peut apparaître, <b>🔑</b> s'utilise ici, <b>🔒</b> accès protégé.</li>
      <li>Le contenu de chaque point est aléatoire et varie selon le serveur.</li>
      <li>Cargaisons : les ronds orange indiquent des emplacements aléatoires sans type d’objet connu ; les carrés turquoise, les 8 cargaisons fixes définies. Cliquez un point pour ouvrir son lieu et son altitude. Les fiches de lieux affichent leurs cargaisons automatiquement.</li>
      <li>Raccourcis : <kbd>/</kbd> rechercher, <kbd>Échap</kbd> retour.</li>
    </ul></div>
    <div class="sec"><h3>Missions spéciales <span class="n">${jobs.length}</span></h3>
      ${jobs.map(p => placeRow(p.slug, "", "🎯 " + JOB[p.job] + " (" + esc(p.job) + ")")).join("")}</div>
    <div class="sec"><h3>Bonus de vente selon la notoriété</h3><div class="tw"><table>
      <tr><th>Niveau</th>${D.notoriety.map(x => `<th>${x.level}</th>`).join("")}</tr>
      <tr><td>Bonus vente d'objets</td>${D.notoriety.map(x => `<td class="num">+${x.itemSale} %</td>`).join("")}</tr></table></div></div>
    <div class="sec"><h3>Totaux par type de butin</h3><div class="tw"><table>
      <tr><th>Type</th><th>Bâtiments</th><th>Extérieur</th><th>Lieu principal</th></tr>
      ${kinds.map(k => `<tr><td>${KIND[k][1]} ${KIND[k][0]}</td><td class="num">${KT[k].in || "—"}</td><td class="num">${KT[k].out || "—"}</td>
        <td>${KT[k].top ? `<button class="link" data-slug="${KT[k].top.slug}">${esc(KT[k].top.full)}</button> (${KT[k].top.spots[k]})` : "—"}</td></tr>`).join("")}
    </table></div></div>
    <div class="sec"><h3>Catégories</h3>
      ${CAT_ORDER.map(c => `<div class="spot" style="margin-bottom:5px"><i style="width:11px;height:11px;border-radius:3px;border:2px solid ${CAT[c].c};background:#1c1f19"></i>${CAT[c].fr}<b>${PL.filter(p => p.cat === c).length}</b></div>`).join("")}</div>
  </div>`;
}

/* ---------- Événements du panneau ---------- */
side.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.cargoPoint) return selectCargo(Number(d.cargoPoint));
  if (d.cargoKind) {S.cargoKind = d.cargoKind; return render({focus:false});}
  if (d.act === "cargo") return tab("cargo");
  if (d.act === "cargo-center") return fitPlaces(CARGO.filter(c => c.slug === S.sel));
  if (d.slug) return go("place", d.slug);
  if (d.item) return go("item", d.item);
  if (d.act === "back") return back();
  if (d.act === "center") { const p = PBY[S.sel]; return focusPoint(p.x, p.y, 3.2); }
  if (d.act === "district") { S.dists = new Set([d.d]); S.cats.clear(); S.loot = null; S.q = S.qn = ""; HIST.length = 0; S.view = "list"; render(); return fitPlaces(MAPPED.filter(p => p.district === d.d)); }
  if (d.act === "reset") { S.cats.clear(); S.dists.clear(); S.loot = null; S.q = S.qn = ""; $("#q").value = ""; refreshList(); return fitView(true); }
  if (d.act === "ireset") { S.rars.clear(); S.icats.clear(); S.iq = S.iqn = ""; S.sort = "value"; $("#iq").value = ""; return refreshItems(); }
  if (d.cat) { S.cats.has(d.cat) ? S.cats.delete(d.cat) : S.cats.add(d.cat); return refreshList(); }
  if (d.dist) { S.dists.has(d.dist) ? S.dists.delete(d.dist) : S.dists.add(d.dist); refreshList(); return S.dists.size ? fitPlaces(MAPPED.filter(p => S.dists.has(p.district))) : fitView(true); }
  if (d.loot) { S.loot = S.loot === d.loot ? null : d.loot; return refreshList(); }
  if (d.rar) { S.rars.has(d.rar) ? S.rars.delete(d.rar) : S.rars.add(d.rar); return refreshItems(); }
  if (d.icat) { S.icats.has(d.icat) ? S.icats.delete(d.icat) : S.icats.add(d.icat); return refreshItems(); }
  if (d.sort) { S.sort = d.sort; return refreshItems(); }
});
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) tab(b.dataset.tab); });
addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Escape") { if (typing) document.activeElement.blur(); else if (S.view === "place" || S.view === "item") back(); }
  if (e.key === "/" && !typing) { e.preventDefault(); if (S.view !== "list" && S.view !== "items") tab("list"); const i = $("#q") || $("#iq"); i && i.focus(); }
});

/* ---------- En-tête et légende ---------- */
$("#hstats").innerHTML = [
  [MAPPED.length,"lieux"],[DIST_ORDER.length,"quartiers"],[fmt(TOTAL_IN),"points de butin"],[D.map.pins.length,"points extérieurs"],[Object.keys(IT).length,"objets"]
].map(([n,l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("");
$("#legend").innerHTML = `<div class="lg">${CAT_ORDER.map(c => `<span style="--cc:${CAT[c].c}"><i></i>${CAT[c].fr}</span>`).join("")}</div>
  <label><input type="checkbox" id="outdoor"> Points extérieurs : <i class="kd" style="--k:${A.kindColor.atm}"></i> DAB · <i class="kd" style="--k:${A.kindColor.cargo}"></i> conteneurs</label>
  <div class="cargo-legend"><label><input type="checkbox" id="cargo-random"><i class="cargo-key"></i> Cargaisons aléatoires · 170 emplacements</label>
  <label><input type="checkbox" id="cargo-fixed"><i class="cargo-key fixed"></i> Cargaisons fixes · 8 emplacements</label></div>`;
$("#outdoor").addEventListener("change", e => { S.outdoor = e.target.checked; updateMap(); });
$("#cargo-random").addEventListener("change",e => {S.cargoRandom=e.target.checked;updateMap();});
$("#cargo-fixed").addEventListener("change",e => {S.cargoFixed=e.target.checked;updateMap();});

/* ---------- Démarrage ---------- */
$("#brand").src = A.art + A.brand;
buildMap();
fitView(false);
function applyHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [kind, id] = h.split("/");
  HIST.length = 0;
  S.cargoPoint = null;
  if (kind === "lieu" && PBY[id]) { S.view = "place"; S.sel = id; }
  else if (kind === "objet" && IT[id]) { S.view = "item"; S.item = id; }
  else if (kind === "objets") S.view = "items";
  else if (kind === "infos") S.view = "info";
  else if (kind === "cargaisons") {S.view="cargo";S.cargoRandom=true;S.cargoFixed=true;}
  else if (kind === "cargaison" && CARGO_BY_ID[id]) {S.view="place";S.sel=CARGO_BY_ID[id].slug;S.cargoPoint=Number(id);}
  else S.view = "list";
  if (S.view === "place") {S.cargoRandom=true;S.cargoFixed=true;}
  render();
  if (S.cargoPoint) {const c=CARGO_BY_ID[S.cargoPoint];focusPoint(c.x,c.y,5);$("#cargo-place").scrollIntoView({block:"nearest"});}
}
addEventListener("hashchange", applyHash);
applyHash();
</script>
</body>
</html>
